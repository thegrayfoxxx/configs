# preset: xray-direct (v3, web только как таргет)
# Управляем только HAProxy. Xray/nginx/static — отдельно, тут только стык (порты/домены).
# Xray слушает :443 напрямую (VLESS+reality+vision), fallback шлет в web-таргет.
# Stream-сервис отключи (только web+acme). Сертификат для таргет-домена выпускает ACME через :80.
ACME_EMAIL="{{ACME_EMAIL}}"
WEB_BACKENDS=(
  "name=stub to=127.0.0.1:{{STUB_PORT}}"
)
WEB_ROUTES=(
  "host={{STUB_DOMAIN}} use=stub"
)
GLOBAL_OPTS=(
  "timeout_connect=5s"
#if TIMEOUT_PROFILE==xhttp-1h
  "timeout_client=1h"
  "timeout_server=1h"
  "timeout_tunnel=1h"
#else
  "timeout_client=50s"
  "timeout_server=50s"
#endif
  "bind_web=127.0.0.1:8443"
  "blackhole={{BLACKHOLE}}"
#if BACKEND_CHECK==tcp
  "backend_check=tcp"
#endif
#if LOGS_CAPTURE==on
  "web_capture_headers=on"
#endif
)
