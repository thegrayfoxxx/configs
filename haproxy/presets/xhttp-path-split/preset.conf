# preset: xhttp-path-split (v3 + именованные ящики)
# Один домен: /data/* -> Xray XHTTP, остальное -> заглушка. Плюс SNI-маршрут для vision-клиентов.
# Ящики поименно: forwardfor ссылается прямо на bk_xhttp (без вычисления тегов).
ACME_EMAIL="{{ACME_EMAIL}}"
STREAM_BACKENDS=(
  "name=xray-vision to=127.0.0.1:{{XRAY_PORT}}"
)
WEB_BACKENDS=(
  "name=xhttp to=127.0.0.1:{{XHTTP_PORT}}"
  "name=stub to=127.0.0.1:{{STUB_PORT}}"
)
STREAM_ROUTES=(
  "sni={{REALITY_DOMAINS}} use=xray-vision"
  "sni=default to=127.0.0.1:8443 proxy=v2 name=web"
)
WEB_ROUTES=(
  "host={{XHTTP_DOMAIN}} use=xhttp path={{XHTTP_PATH}}"
  "host={{XHTTP_DOMAIN}} use=stub"
)
GLOBAL_OPTS=(
  "timeout_connect=5s"
  "timeout_client=1h"
  "timeout_server=1h"
  "timeout_tunnel=1h"
  "bind_stream=*:443"
  "bind_web=127.0.0.1:8443"
  "blackhole=deny"
  "stream_web_proxy=v2"
  "web_accept_proxy=on"
  "forwardfor_backends=bk_xhttp"
)
