# preset: xhttp-path-split (сгенерировано визардом preset.sh)
# Один домен: /data/* -> Xray XHTTP, остальное -> заглушка. Плюс reality-нога.
ACME_EMAIL="{{ACME_EMAIL}}"
WEB_SITES=(
  "{{XHTTP_DOMAIN}}:{{XHTTP_PORT}}:path={{XHTTP_PATH}}"
  "{{XHTTP_DOMAIN}}:{{STUB_PORT}}"
)
REALITY_SITES=(
  "{{REALITY_DOMAINS}}:{{XRAY_PORT}}"
)
GLOBAL_OPTS=(
  "timeout_connect=5s"
  "timeout_client=1h"
  "timeout_server=1h"
  "timeout_tunnel=1h"
  "bind_stream=*:443"
  "bind_web=127.0.0.1:8443"
  "blackhole=deny"
  "stream_web_proxy=v2"
  "web_accept_proxy=on"
  "forwardfor_backends=bk_{{TAG}}"
)
