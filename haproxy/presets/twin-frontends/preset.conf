# preset: twin-frontends (v3 + именованные фронтенды)
# Два stream-уха: public (интернет) и internal (офис/loopback), один web-фронтенд.
# Маршруты с frontend= слышны только в своём ухе, без области — везде.
ACME_EMAIL="{{ACME_EMAIL}}"
STREAM_FRONTENDS=(
  "name=public bind={{PUB_BIND}}"
  "name=internal bind={{INT_BIND}}"
)
WEB_FRONTENDS=(
  "name=main bind={{WEB_BIND}}"
)
STREAM_ROUTES=(
  "sni={{PUB_SNI}} to={{PUB_TO}} proxy=off name=pub frontend=public"
  "sni={{INT_SNI}} to={{INT_TO}} proxy=off name=int frontend=internal"
  "sni=default to={{WEB_DEF_TO}} proxy=off name=web"
)
WEB_ROUTES=(
{{SITES_LINES}}
)
GLOBAL_OPTS=(
  "timeout_connect=5s"
  "timeout_client=1h"
  "timeout_server=1h"
  "timeout_tunnel=1h"
  # bind_* не заданы намеренно: при непустых *_FRONTENDS генератор их игнорирует.
  "blackhole=deny"
)
