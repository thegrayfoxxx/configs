# preset: stream-vision (v3 + опции SELFSTEAL x WEB_MODE)
# Управляем только HAProxy. Xray/nginx/CDN — отдельно, тут только стык (SNI/Host/порты/path).
# :443 держит haproxy-stream (SNI-сплит): reality-SNI -> Xray, остальное -> web-терминация.
# SELFSTEAL=yes: REALITY SNI совпадает со STUB-доменом (селфстил-таргет, как в проде).
# WEB_MODE: sites — N сайтов; xhttp-split — path-сплит (stub + Xray XHTTP).
ACME_EMAIL="{{ACME_EMAIL}}"
STREAM_BACKENDS=(
#if XRAY_PROXY==v2
  "name=xray to=127.0.0.1:{{XRAY_PORT}} proxy=v2"
#else
  "name=xray to=127.0.0.1:{{XRAY_PORT}}"
#endif
)
WEB_BACKENDS=(
#if WEB_MODE==xhttp-split
  "name=xhttp to=127.0.0.1:{{XHTTP_PORT}}"
  "name=stub to=127.0.0.1:{{STUB_PORT}}"
#endif
)
STREAM_ROUTES=(
  "sni={{REALITY_DOMAINS}} use=xray"
  "sni=default to=127.0.0.1:8443 proxy={{STREAM_WEB_PROXY}} name=web"
)
WEB_ROUTES=(
#if WEB_MODE==sites
{{SITES_LINES}}
#else
#if SELFSTEAL==yes
  "host={{STUB_DOMAIN}} use=stub"
#endif
  "host={{XHTTP_DOMAIN}} use=xhttp path={{XHTTP_PATH}}"
  "host={{XHTTP_DOMAIN}} use=stub"
#endif
)
GLOBAL_OPTS=(
  "timeout_connect=5s"
#if TIMEOUT_PROFILE==sites-50s
  "timeout_client=50s"
  "timeout_server=50s"
#else
  "timeout_client=1h"
  "timeout_server=1h"
  "timeout_tunnel=1h"
#endif
  "bind_stream=*:443"
  "bind_web=127.0.0.1:8443"
  "blackhole={{BLACKHOLE}}"
  "stream_web_proxy={{STREAM_WEB_PROXY}}"
  "web_accept_proxy={{WEB_ACCEPT_PROXY}}"
#if BACKEND_CHECK==tcp
  "backend_check=tcp"
#endif
#if STREAM_LOG_SNI==on
  "stream_log_sni=on"
#endif
#if LOGS_CAPTURE==on
  "web_capture_headers=on"
#endif
#if WEB_MODE==xhttp-split
  "forwardfor_backends=bk_xhttp"
#endif
)
