# preset: reality-selfsteal (v3 + именованный ящик)
# Классика: SNI -> xray (REALITY self-steal), остальное -> web-заглушка.
# Нейтральное ядро видит лишь stream-маршрут со ссылкой; что за бэкенд (xray) — знает только пресет.
ACME_EMAIL="{{ACME_EMAIL}}"
STREAM_BACKENDS=(
  "name=xray to=127.0.0.1:{{XRAY_PORT}}"
)
STREAM_ROUTES=(
  "sni={{REALITY_DOMAINS}} use=xray"
  "sni=default to=127.0.0.1:8443 proxy=v2 name=web"
)
WEB_ROUTES=(
  "host={{STUB_DOMAIN}} to=127.0.0.1:{{STUB_PORT}}"
)
GLOBAL_OPTS=(
  "timeout_connect=5s"
  "timeout_client=1h"
  "timeout_server=1h"
  "timeout_tunnel=1h"
  "bind_stream=*:443"
  "bind_web=127.0.0.1:8443"
  "blackhole=deny"
  "stream_web_proxy=v2"
  "web_accept_proxy=on"
)
