# preset: multi-site-l7 (v3)
# Пачка обычных сайтов за web-терминацией + blackhole для чужих.
ACME_EMAIL="{{ACME_EMAIL}}"
STREAM_ROUTES=(
  "sni=default to=127.0.0.1:8443 proxy=off name=web"
)
WEB_ROUTES=(
{{SITES_LINES}}
)
GLOBAL_OPTS=(
  "timeout_connect=5s"
  "timeout_client=50s"
  "timeout_server=50s"
  "bind_stream=*:443"
  "bind_web=*:8443"
  "blackhole={{BLACKHOLE}}"
)
