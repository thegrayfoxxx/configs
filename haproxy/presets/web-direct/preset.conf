# preset: web-direct (v3 + опции WEB_MODE)
# Управляем только HAProxy. Xray/nginx/static — отдельно, тут только стык (порты/домены/path).
# Web слушает :443 напрямую (без stream). Stream-сервис отключи (только web+acme).
ACME_EMAIL="{{ACME_EMAIL}}"
WEB_BACKENDS=(
#if WEB_MODE==xhttp-split
  "name=xhttp to=127.0.0.1:{{XHTTP_PORT}}"
  "name=stub to=127.0.0.1:{{STUB_PORT}}"
#endif
)
WEB_ROUTES=(
#if WEB_MODE==sites
{{SITES_LINES}}
#else
  "host={{XHTTP_DOMAIN}} use=xhttp path={{XHTTP_PATH}}"
  "host={{XHTTP_DOMAIN}} use=stub"
#endif
)
GLOBAL_OPTS=(
  "timeout_connect=5s"
#if TIMEOUT_PROFILE==xhttp-1h
  "timeout_client=1h"
  "timeout_server=1h"
  "timeout_tunnel=1h"
#else
  "timeout_client=50s"
  "timeout_server=50s"
#endif
  "bind_web=*:443"
  "blackhole={{BLACKHOLE}}"
#if BACKEND_CHECK==tcp
  "backend_check=tcp"
#endif
#if LOGS_CAPTURE==on
  "web_capture_headers=on"
#endif
#if WEB_MODE==xhttp-split
  "forwardfor_backends=bk_xhttp"
#endif
)
