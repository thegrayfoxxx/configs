# stream-vision, SELFSTEAL=no + sites (vision отдельно, web — список сайтов)
ACME_EMAIL="t@e.com"
STREAM_BACKENDS=(
  "name=xray to=127.0.0.1:10443 proxy=v2"
)
STREAM_ROUTES=(
  "sni=vpn.example.com use=xray"
  "sni=default to=127.0.0.1:8443 proxy=v2 name=web"
)
WEB_ROUTES=(
  "host=a.com to=127.0.0.1:8080"
  "host=b.com to=127.0.0.1:9090"
)
GLOBAL_OPTS=(
  "timeout_connect=5s"
  "timeout_client=50s"
  "timeout_server=50s"
  "bind_stream=*:443"
  "bind_web=127.0.0.1:8443"
  "blackhole=deny"
  "stream_web_proxy=v2"
  "web_accept_proxy=on"
  "xray_xver=v2"
)
