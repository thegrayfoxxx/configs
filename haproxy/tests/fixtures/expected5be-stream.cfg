global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend ft_https
    bind *:443
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }

    acl is_s_1 req.ssl_sni -i a.example.com
    use_backend bk_shared-be if is_s_1
    acl is_s_2 req.ssl_sni -i b.example.com
    use_backend bk_shared-be if is_s_2
    acl is_s_3 req.ssl_sni -i c.example.com
    use_backend bk_sni-3 if is_s_3

    default_backend bk_web

backend bk_shared-be
    mode tcp
    no log
    server shared-be 127.0.0.1:10443

backend bk_web
    mode tcp
    server web 127.0.0.1:8443

backend bk_sni-3
    mode tcp
    server sni-3 127.0.0.1:10444 send-proxy-v2

