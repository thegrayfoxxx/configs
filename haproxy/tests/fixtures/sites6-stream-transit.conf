# preset: stream-vision (v3 + опции SELFSTEAL x WEB_MODE + TRANSIT)
# Управляем только HAProxy. Xray/nginx/CDN — отдельно, тут только стык (SNI/Host/порты/path).
# :443 держит haproxy-stream (SNI-сплит): reality-SNI -> Xray, остальное -> web-терминация.
# SELFSTEAL=yes: REALITY SNI совпадает со STUB-доменом (селфстил-таргет, как в проде).
# WEB_MODE: sites — N сайтов; xhttp-split — path-сплит (stub + Xray XHTTP).
# TRANSIT=yes: второе ухо (транзит между серверами, ТОЛЬКО с PROXY-заголовком) —
# маршруты без frontend= слышны сразу в обоих ушах; транзит вешать на доверенный
# адрес + файрвол (PROXY spoofing!), см. README раздел «Транзит».
ACME_EMAIL="t@e.com"
STREAM_FRONTENDS=(
  "name=edge bind=*:443"
  "name=transit bind=*:4443 accept_proxy=on"
)
STREAM_BACKENDS=(
  "name=xray to=127.0.0.1:10443 proxy=v2"
)
WEB_BACKENDS=(
)
STREAM_ROUTES=(
  "sni=vpn.example.com use=xray"
  "sni=default to=127.0.0.1:8443 proxy=off name=web"
)
WEB_ROUTES=(
  "host=a.com to=127.0.0.1:8080"
)
GLOBAL_OPTS=(
  "timeout_connect=5s"
  "timeout_client=50s"
  "timeout_server=50s"
  "bind_stream=*:443"
  "bind_web=127.0.0.1:8443"
  "blackhole=deny"
  "stream_web_proxy=off"
  "web_accept_proxy=off"
  "xray_xver=off"
)
