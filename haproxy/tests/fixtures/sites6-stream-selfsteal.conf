# stream-vision, SELFSTEAL=yes + xhttp-split (прод-схема)
ACME_EMAIL="t@e.com"
STREAM_BACKENDS=(
  "name=xray to=127.0.0.1:10443 proxy=v2"
)
WEB_BACKENDS=(
  "name=xhttp to=127.0.0.1:11443"
  "name=stub to=127.0.0.1:8080"
)
STREAM_ROUTES=(
  "sni=drop.example.com use=xray"
  "sni=default to=127.0.0.1:8443 proxy=v2 name=web"
)
WEB_ROUTES=(
  "host=drop.example.com use=stub"
  "host=x.cdn.example.com use=xhttp path=/data/"
  "host=x.cdn.example.com use=stub"
)
GLOBAL_OPTS=(
  "timeout_connect=5s"
  "timeout_client=1h"
  "timeout_server=1h"
  "timeout_tunnel=1h"
  "bind_stream=*:443"
  "bind_web=127.0.0.1:8443"
  "blackhole=deny"
  "stream_web_proxy=v2"
  "web_accept_proxy=on"
  "xray_xver=v2"
  "forwardfor_backends=bk_xhttp"
)
