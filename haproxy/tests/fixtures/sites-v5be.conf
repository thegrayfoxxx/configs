# Фикстура BACKENDS-сущности: именованные ящики, shared двумя маршрутами,
# инлайн рядом, default ссылкой.
ACME_EMAIL="test@example.com"

STREAM_BACKENDS=(
  "name=shared-be to=127.0.0.1:10443 proxy=off log=off"
  "name=web to=127.0.0.1:8443"
)

STREAM_ROUTES=(
  "sni=a.example.com use=shared-be"
  "sni=b.example.com use=shared-be"
  "sni=c.example.com to=127.0.0.1:10444 proxy=v2 name=sni-3"
  "sni=default use=web"
)

WEB_ROUTES=(
  "host=app1.example.com use=app"
  "host=app2.example.com use=app"
  "host=plain.example.com to=127.0.0.1:8080"
)

WEB_BACKENDS=(
  "name=app to=127.0.0.1:9090 log=off"
)

GLOBAL_OPTS=(
  "timeout_connect=5s"
  "timeout_client=50s"
  "timeout_server=50s"
  "bind_stream=*:443"
  "bind_web=*:8443"
  "blackhole=deny"
)
