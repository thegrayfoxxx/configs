global
    log stdout format raw local0
    maxconn 4096
    tune.ssl.default-dh-param 2048
    ca-base /etc/ssl/certs
    crt-base /etc/haproxy/certs

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend ft_https_terminated
    bind *:8443 ssl crt /etc/haproxy/certs/ accept-proxy
    mode http

    acl host_site_site1_com hdr(host) -i site1.com
    use_backend bk_site_site1_com if host_site_site1_com

    default_backend bk_blackhole

backend bk_site_site1_com
    mode http
    server site_site1_com 127.0.0.1:8080 check inter 10s fall 2 rise 2

backend bk_blackhole
    mode http
    http-request deny deny_status 404
