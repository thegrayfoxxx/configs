global
    log stdout format raw local0
    maxconn 4096
    tune.ssl.default-dh-param 2048
    ca-base /etc/ssl/certs
    crt-base /etc/haproxy/certs

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend ft_https_terminated
    bind *:8443 ssl crt /etc/haproxy/certs/
    mode http

    capture request header Host len 64
    capture request header X-Forwarded-For len 128
    acl host_site_s_com hdr(host),regsub(:[0-9]+$,) -i s.com
    use_backend bk_site_s_com if host_site_s_com

    default_backend bk_blackhole

backend bk_site_s_com
    mode http
    option forwardfor
    server site_s_com 127.0.0.1:8080

backend bk_blackhole
    mode http
    http-request deny
