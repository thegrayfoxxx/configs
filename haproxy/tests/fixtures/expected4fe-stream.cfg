global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend ft_public
    bind *:443
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }

    acl is_s_1 req.ssl_sni -i vpn.example.com
    use_backend bk_sni-1 if is_s_1
    acl is_s_2 req.ssl_sni -i shared.example.com
    use_backend bk_shared if is_s_2

    default_backend bk_web

frontend ft_office
    bind 10.0.0.1:8445
    mode tcp
    no log
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }

    acl is_s_1 req.ssl_sni -i ops.internal
    use_backend bk_sni-2 if is_s_1
    acl is_s_2 req.ssl_sni -i shared.example.com
    use_backend bk_shared if is_s_2

    default_backend bk_web

backend bk_sni-1
    mode tcp
    server sni-1 127.0.0.1:10443

backend bk_sni-2
    mode tcp
    server sni-2 127.0.0.1:10444 send-proxy-v2

backend bk_shared
    mode tcp
    server shared 127.0.0.1:10445

backend bk_web
    mode tcp
    server web 127.0.0.1:8443

