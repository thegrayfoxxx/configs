global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    timeout tunnel 1h

frontend ft_https
    bind *:443
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }

    acl is_reality_1 req.ssl_sni -i a.example.com
    use_backend bk_xray_1 if is_reality_1
    acl is_reality_2 req.ssl_sni -i b.example.com www.b.example.com
    use_backend bk_xray_2 if is_reality_2

    default_backend bk_haproxy_web

backend bk_xray_1
    mode tcp
    server xray 127.0.0.1:10443

backend bk_xray_2
    mode tcp
    server xray 127.0.0.1:10444 send-proxy-v2

backend bk_haproxy_web
    mode tcp
    server haproxy_web 127.0.0.1:8443
