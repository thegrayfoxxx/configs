global
    log stdout format raw local0
    maxconn 4096
    tune.ssl.default-dh-param 2048
    ca-base /etc/ssl/certs
    crt-base /etc/haproxy/certs

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    timeout tunnel 1h

frontend ft_https_terminated
    bind *:443 ssl crt /etc/haproxy/certs/
    mode http

    acl host_xhttp hdr(host) -i x.cdn.example.com
    acl path_xhttp_1 path_beg /data/
    use_backend bk_xhttp if host_xhttp path_xhttp_1
    acl host_stub hdr(host) -i x.cdn.example.com
    use_backend bk_stub if host_stub

    default_backend bk_blackhole

backend bk_xhttp
    mode http
    option forwardfor
    server xhttp 127.0.0.1:11443

backend bk_stub
    mode http
    server stub 127.0.0.1:8080

backend bk_blackhole
    mode http
    http-request deny
