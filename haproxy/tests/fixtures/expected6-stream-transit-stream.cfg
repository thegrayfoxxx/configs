global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend ft_edge
    bind *:443
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }

    acl is_s_1 req.ssl_sni -i vpn.example.com
    use_backend bk_xray if is_s_1

    default_backend bk_web

frontend ft_transit
    bind *:4443 accept-proxy
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }

    acl is_s_1 req.ssl_sni -i vpn.example.com
    use_backend bk_xray if is_s_1

    default_backend bk_web

backend bk_xray
    mode tcp
    server xray 127.0.0.1:10443 send-proxy-v2

backend bk_web
    mode tcp
    server web 127.0.0.1:8443

