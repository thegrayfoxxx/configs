global
    log stdout format raw local0
    maxconn 4096
    tune.ssl.default-dh-param 2048
    ca-base /etc/ssl/certs
    crt-base /etc/haproxy/certs

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend ft_main
    bind *:8443 ssl crt /etc/haproxy/certs/
    mode http

    acl host_site_site1_com hdr(host),regsub(:[0-9]+$,) -i site1.com
    use_backend bk_site_site1_com if host_site_site1_com

    acl host_site_shared_example_com hdr(host),regsub(:[0-9]+$,) -i shared.example.com
    use_backend bk_site_shared_example_com if host_site_shared_example_com

    default_backend bk_blackhole

frontend ft_internal
    bind 127.0.0.1:9443 ssl crt /etc/haproxy/certs/
    mode http
    no log

    acl host_site_ops_internal hdr(host),regsub(:[0-9]+$,) -i ops.internal
    use_backend bk_site_ops_internal if host_site_ops_internal

    acl host_site_shared_example_com hdr(host),regsub(:[0-9]+$,) -i shared.example.com
    use_backend bk_site_shared_example_com if host_site_shared_example_com

    default_backend bk_blackhole

backend bk_site_site1_com
    mode http
    server site_site1_com 127.0.0.1:8080

backend bk_site_ops_internal
    mode http
    no log
    server site_ops_internal 127.0.0.1:8081

backend bk_site_shared_example_com
    mode http
    server site_shared_example_com 127.0.0.1:8082

backend bk_blackhole
    mode http
    http-request deny
