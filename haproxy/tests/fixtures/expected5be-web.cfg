global
    log stdout format raw local0
    maxconn 4096
    tune.ssl.default-dh-param 2048
    ca-base /etc/ssl/certs
    crt-base /etc/haproxy/certs

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend ft_https_terminated
    bind *:8443 ssl crt /etc/haproxy/certs/
    mode http

    acl host_app hdr(host),regsub(:[0-9]+$,) -i app1.example.com
    use_backend bk_app if host_app

    acl host_app_2 hdr(host),regsub(:[0-9]+$,) -i app2.example.com
    use_backend bk_app if host_app_2

    acl host_site_plain_example_com hdr(host),regsub(:[0-9]+$,) -i plain.example.com
    use_backend bk_site_plain_example_com if host_site_plain_example_com

    default_backend bk_blackhole

backend bk_app
    mode http
    no log
    server app 127.0.0.1:9090

backend bk_site_plain_example_com
    mode http
    server site_plain_example_com 127.0.0.1:8080

backend bk_blackhole
    mode http
    http-request deny
