# Фикстура v3 golden-теста: нейтральные SNI/Host-маршруты + явный default.
# Семантика = sites2.conf (multi-backend + path-split), синтаксис v3.
ACME_EMAIL="test@example.com"

STREAM_ROUTES=(
  "sni=a.example.com to=127.0.0.1:10443 proxy=off name=sni-1"
  "sni=b.example.com www.b.example.com to=127.0.0.1:10444 proxy=v2 name=sni-2"
  "sni=default to=127.0.0.1:8443 proxy=off name=web"
)

WEB_ROUTES=(
  "host=site1.com to=127.0.0.1:8080"
  "host=x.example.com to=127.0.0.1:11443 path=/data/"
  "host=x.example.com to=127.0.0.1:8080"
)

GLOBAL_OPTS=(
  "timeout_connect=5s"
  "timeout_client=1h"
  "timeout_server=1h"
  "timeout_tunnel=1h"
  "bind_stream=*:443"
  "bind_web=127.0.0.1:8443"
  "blackhole=tarpit"
)
