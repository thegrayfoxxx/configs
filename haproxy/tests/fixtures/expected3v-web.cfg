global
    log stdout format raw local0
    maxconn 4096
    tune.ssl.default-dh-param 2048
    ca-base /etc/ssl/certs
    crt-base /etc/haproxy/certs

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    timeout tunnel 1h
    timeout tarpit 10s

frontend ft_https_terminated
    bind 127.0.0.1:8443 ssl crt /etc/haproxy/certs/
    mode http

    acl host_site_site1_com hdr(host) -i site1.com
    use_backend bk_site_site1_com if host_site_site1_com

    acl host_site_x_example_com_11443 hdr(host) -i x.example.com
    acl path_site_x_example_com_11443_1 path_beg /data/
    use_backend bk_site_x_example_com_11443 if host_site_x_example_com_11443 path_site_x_example_com_11443_1
    acl host_site_x_example_com_8080 hdr(host) -i x.example.com
    use_backend bk_site_x_example_com_8080 if host_site_x_example_com_8080

    default_backend bk_blackhole

backend bk_site_site1_com
    mode http
    server site_site1_com 127.0.0.1:8080

backend bk_site_x_example_com_11443
    mode http
    server site_x_example_com_11443 127.0.0.1:11443

backend bk_site_x_example_com_8080
    mode http
    server site_x_example_com_8080 127.0.0.1:8080

backend bk_blackhole
    mode http
    http-request tarpit
