# Фикстура multi-frontend: два stream-фронтенда (области + свои/global default),
# два web-фронтенда (области), shared-маршруты без области (видны везде).
ACME_EMAIL="test@example.com"

STREAM_FRONTENDS=(
  "name=public bind=*:443"
  "name=office bind=10.0.0.1:8445 log=off"
)

STREAM_ROUTES=(
  "sni=vpn.example.com to=127.0.0.1:10443 proxy=off name=sni-1 frontend=public"
  "sni=ops.internal to=127.0.0.1:10444 proxy=v2 name=sni-2 frontend=office"
  "sni=shared.example.com to=127.0.0.1:10445 name=shared"
  "sni=default to=127.0.0.1:8443 proxy=off name=web frontend=public"
  "sni=default to=127.0.0.1:8443 proxy=off name=web"
)

WEB_ROUTES=(
  "host=site1.com to=127.0.0.1:8080 frontend=main"
  "host=ops.internal to=127.0.0.1:8081 frontend=internal log=off"
  "host=shared.example.com to=127.0.0.1:8082"
)

WEB_FRONTENDS=(
  "name=main bind=*:8443"
  "name=internal bind=127.0.0.1:9443 log=off"
)

GLOBAL_OPTS=(
  "timeout_connect=5s"
  "timeout_client=50s"
  "timeout_server=50s"
  "bind_stream=*:443"
  "bind_web=*:8443"
  "blackhole=deny"
)
